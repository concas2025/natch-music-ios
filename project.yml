# Natch Music (iOS) — XcodeGen Specification
# Port based on Mochy Music (https://github.com/realidkroo/Mochy-Music, GPL-3.0)
# Built upon the foundations of Mochy Music, ViviMusic, Metrolist, and InnerTune.

name: NatchMusic
options:
  bundleIdPrefix: com.natch
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  MochyPackages:
    path: Packages

targets:
  NatchMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: MochyPackages
        product: MochyCore
      - package: MochyPackages
        product: MochyDatabase
      - package: MochyPackages
        product: MochyInnerTube
      - package: MochyPackages
        product: MochyModules
      - package: MochyPackages
        product: MochyDSP
      - package: MochyPackages
        product: MochyLyrics
      - package: MochyPackages
        product: MochyAudio
      - package: MochyPackages
        product: MochySync
      - package: MochyPackages
        product: MochyUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Natch Music
        CFBundleName: Natch Music
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: "Natch Music uses the microphone to identify songs playing nearby via ShazamKit."
        NSLocalNetworkUsageDescription: "Natch Music discovers Mochy Link devices on your Wi-Fi network for remote playback and library transfer."
        NSAppleMusicUsageDescription: "Natch Music can optionally match and play your Apple Music catalog tracks."
        NSBonjourServices:
          - _mochy-link._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natch.music.ios
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

schemes:
  NatchMusic:
    build:
      targets:
        NatchMusic: all
    archive:
      config: Release
